name: Verificações da API
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python3 -m py_compile scripts/import_records.py
