name: Verificações da API
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        npm-version: ['10.9.2', '11.9.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar com npm ${{ matrix.npm-version }}
        env:
          NPM_VERSION: ${{ matrix.npm-version }}
        run: npm exec --yes --package="npm@$NPM_VERSION" -- npm ci
      - run: npm test
      - run: npm run test:cnes
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python3 -m py_compile scripts/import_records.py
